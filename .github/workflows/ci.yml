name: CI

on:
  push:
    branches:
      - main
      - contribution
  pull_request:

# cancel in-progress runs on new commits to same PR (gitub.event.number)
concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)
  actions: write # to delete cache (actions/cache)
  pull-requests: read # to check for open PRs (gh pr list)

env:
  # set the default node version to use in the matrix
  DEFAULT_MATRIX_NODE_VERSION: '["22", "24", "26"]'
  DEFAULT_CACHE_RESET: false

jobs:
  # echo:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: ${{ tojson(github) }}
  #       shell: cat {0}

  check-execution:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.finalize.outputs.should-run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: check-event
        name: Check if there are no open PRs for contribution -> main on push to contribution
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Checking if the workflow should execute for this event"
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/contribution" ]]; then
            echo "This is a push event to contribution branch, checking for open PRs..."
            pr_count=$(gh pr list --head contribution --base main --state open --limit 1 --json number --jq 'length')
            if [[ "$pr_count" -gt 0 ]]; then
              echo "There is an open PR for contribution -> main, skipping this workflow to avoid duplicate runs."
              echo "should-run=false" >> "$GITHUB_OUTPUT"
            else
              echo "No open PRs for contribution -> main, proceeding with this workflow."
              echo "should-run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "This is not a push event to contribution branch, proceeding with this workflow."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

      - id: check-sync
        name: Check that push to contribution does not produce content identical to main
        if: steps.check-event.outputs.should-run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" != "push" || "${{ github.ref }}" != "refs/heads/contribution" ]]; then
            echo "This is not a push event to contribution branch, proceeding with this workflow."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Checking whether contribution content is identical to main..."

          git fetch origin main

          main_tree="$(git rev-parse origin/main^{tree})"
          head_tree="$(git rev-parse HEAD^{tree})"

          echo "origin/main tree: $main_tree"
          echo "HEAD tree:        $head_tree"

          if [[ "$main_tree" == "$head_tree" ]]; then
            echo "Contribution content is identical to main, skipping duplicate run."
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Contribution content differs from main, proceeding with this workflow."
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

      - id: finalize
        name: Finalize whether the workflow should run based on previous checks
        shell: bash
        run: |
          if [[ "${{ steps.check-event.outputs.should-run }}" != "true" ]]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.check-sync.outputs.should-run }}" != "true" ]]; then
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          fi

  config:
    needs: check-execution
    if: needs.check-execution.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix-node-version: ${{ steps.matrix-node-version.outputs.matrix-node-version }}
      sonar: ${{ steps.sonar.outputs.sonar }}
      cache-reset: ${{ steps.cache-reset.outputs.cache-reset }}
    steps:
      - id: matrix-node-version
        shell: bash
        run: |
          # Set the node version to use in the matrix
          value='${{ vars.MATRIX_NODE_VERSION || env.DEFAULT_MATRIX_NODE_VERSION || '' }}'
          printf 'matrix-node-version=%s\n' "$value" >> "$GITHUB_OUTPUT"

      - id: sonar
        run: |
          # Check if the SONAR_TOKEN secret is set, if not skip the sonar job
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "SONAR_TOKEN is not set, skipping sonar job"
            echo "sonar=false" >> "$GITHUB_OUTPUT"
          else
            echo "SONAR_TOKEN is set, running sonar job"
            echo "sonar=true" >> "$GITHUB_OUTPUT"
          fi

      - id: cache-reset
        run: |
          # Set the cache reset to use
          echo "cache-reset=${{ vars.CACHE_RESET || env.DEFAULT_CACHE_RESET }}" >> "$GITHUB_OUTPUT"

  check:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: kt-workflows/actions/npm-ci-check@main
        with:
          install-script: npm ci && npm ci --prefix examples/sveltekit && npm ci --prefix examples/react
          run-script: |
            npm run check
            npm run lint
            npm run build -w @mirasen/react-chessboard
            npm --prefix examples/sveltekit run check
            npm --prefix examples/sveltekit run build
            npm --prefix examples/react run build
          matrix-node-version: ${{ needs.config.outputs.matrix-node-version }}
          cache-reset: ${{ needs.config.outputs.cache-reset }}

  test:
    needs: config
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ fromJson(needs.config.outputs.matrix-node-version) }}
    steps:
      - uses: kt-workflows/actions/npm-ci-test@main
        with:
          install-script: npm ci
          run-script: npm run coverage
          node-version: ${{ matrix.node-version }}
          cache-reset: ${{ needs.config.outputs.cache-reset }}

      - name: Stage package coverage reports
        shell: bash
        run: |
          set -euo pipefail
          for package in chessboard react-chessboard; do
            report="packages/${package}/coverage-test/lcov.info"
            test -s "$report"
            if grep -q '^SF:src/' "$report"; then
              echo "LCOV reporter emitted package-relative paths in $report" >&2
              exit 1
            fi
            grep -q "^SF:packages/${package}/src/" "$report"
            artifact_report="coverage-artifacts/packages/${package}/coverage-test/lcov.info"
            mkdir -p "$(dirname "$artifact_report")"
            cp "$report" "$artifact_report"
          done

      - name: Upload package coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage-artifacts/
          if-no-files-found: error

  snyk:
    needs: config
    runs-on: ubuntu-latest
    steps:
      - uses: kt-workflows/actions/npm-ci-snyk@main
        with:
          matrix-node-version: ${{ needs.config.outputs.matrix-node-version }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          args: >-
            --all-projects --fail-fast --detection-depth=3 --org=mirasen
            --strict-out-of-sync=true --json-file-output=snyk-results.json
          cache-reset: ${{ needs.config.outputs.cache-reset }}

      - name: Summarize structured Snyk scan results
        if: always() && hashFiles('snyk-results.json') != ''
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');

          const results = JSON.parse(fs.readFileSync('snyk-results.json', 'utf8'));
          const reports = Array.isArray(results) ? results : [results];
          const expected = new Map([
            ['package.json', { projectName: 'mirasen-chessboard-workspace', manifest: 'package.json' }],
            [
              'packages/chessboard/package.json',
              { projectName: '@mirasen/chessboard', manifest: 'packages/chessboard/package.json' },
            ],
            [
              'packages/react-chessboard/package.json',
              { projectName: '@mirasen/react-chessboard', manifest: 'packages/react-chessboard/package.json' },
            ],
            [
              'examples/react/package-lock.json',
              { projectName: 'react-chessboard-example', manifest: 'examples/react/package.json' },
            ],
            [
              'examples/sveltekit/package-lock.json',
              { projectName: 'sveltekit', manifest: 'examples/sveltekit/package.json' },
            ],
          ]);
          const byTarget = new Map();

          function normalizeTarget(targetFile) {
            const normalized = targetFile.replaceAll('\\', '/').replace(/^\.\//, '');
            for (const root of ['/github/workspace/', `${process.cwd().replaceAll('\\', '/')}/`]) {
              if (normalized.startsWith(root)) return normalized.slice(root.length);
            }
            return normalized;
          }

          for (const report of reports) {
            const targetFile = report.displayTargetFile || report.targetFile;
            if (typeof targetFile !== 'string' || targetFile.length === 0) continue;
            const target = normalizeTarget(targetFile);
            byTarget.set(target, report);
          }

          for (const [target, expectedProject] of expected) {
            const report = byTarget.get(target);
            if (!report) {
              console.error(`Snyk did not return a result for ${expectedProject.manifest} (target ${target})`);
              process.exitCode = 1;
              continue;
            }
            if (report.projectName !== expectedProject.projectName) {
              console.error(
                `Unexpected Snyk project for ${target}: ${report.projectName} (expected ${expectedProject.projectName})`,
              );
              process.exitCode = 1;
            }
            const dependencyCount = report.dependencyCount;
            if (
              expectedProject.projectName !== 'mirasen-chessboard-workspace' &&
              !(Number.isFinite(dependencyCount) && dependencyCount > 0)
            ) {
              console.error(`Snyk did not report production dependencies for ${expectedProject.manifest}`);
              process.exitCode = 1;
            }
            console.log(
              `- ${expectedProject.manifest}: ${report.projectName} (${dependencyCount ?? 'no production dependencies'} dependencies)`,
            );
          }

          if (reports.length !== expected.size) {
            console.error(`Snyk returned ${reports.length} projects; expected ${expected.size}`);
            process.exitCode = 1;
          }
          NODE

      - name: Upload structured Snyk results
        if: always() && hashFiles('snyk-results.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: snyk-results-${{ github.run_id }}
          path: snyk-results.json
          if-no-files-found: error
          retention-days: 1

  sonar:
    needs:
      - config
      - test
    if: needs.config.outputs.sonar == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # fetch all history for accurate SonarCloud analysis

      - name: Download coverage artifacts from every Node.js job
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-node-*
          path: coverage-reports
          merge-multiple: false

      - name: Verify downloaded coverage reports from each matrix job
        shell: bash
        run: |
          set -euo pipefail
          artifact_count=0
          for artifact in coverage-reports/*; do
            test -d "$artifact"
            test -s "$artifact/packages/chessboard/coverage-test/lcov.info"
            test -s "$artifact/packages/react-chessboard/coverage-test/lcov.info"
            artifact_count=$((artifact_count + 1))
          done
          test "$artifact_count" -gt 0
          report_count="$(find coverage-reports -type f -name lcov.info | wc -l)"
          test "$report_count" -eq "$((artifact_count * 2))"
          echo "Verified $report_count LCOV reports from $artifact_count Node.js matrix jobs"

      - name: Scan monorepo SonarQube Cloud project
        uses: kt-workflows/actions/npm-ci-sonar@main
        with:
          checkout: false # already checked out in previous step
          matrix-node-version: ${{ needs.config.outputs.matrix-node-version }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          fail-on-empty-token: true
          cache-reset: ${{ needs.config.outputs.cache-reset }}
          install-script: npm ci && npm ci --prefix examples/sveltekit && npm ci --prefix examples/react
          run-script: |
            npm run check
            npm --prefix examples/sveltekit run check
          project-base-dir: .

  # Stable aggregate required-* checks for branch protection rules.
  # This avoids depending directly on individual matrix job statuses.
  required-main:
    name: required-main (${{ github.event_name }})
    needs:
      - check
      - test
      - snyk
      - sonar
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs for main
        shell: bash
        run: |
          echo "Required jobs for main are fulfilled"

  required-contribution:
    name: required-contribution (${{ github.event_name }})
    needs:
      - check
      - test
      - snyk
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs for contribution
        shell: bash
        run: |
          echo "Required jobs for contribution are fulfilled"
