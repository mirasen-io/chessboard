name: Release

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to create release (changesets/action)
  id-token: write # OpenID Connect token needed for provenance
  pull-requests: write # to create pull request (changesets/action)

jobs:
  # echo:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - run: ${{ tojson(github) }}
  #       shell: cat {0}

  release:
    # prevents this action from running on forks
    if: >-
      github.repository == 'mirasen-io/chessboard' && 
      github.event.workflow_run.event == 'push' && 
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release-branch: ${{ steps.release.outputs.release-branch }}
    steps:
      - id: release
        uses: kt-workflows/actions/npm-release@main
        with:
          app-id: ${{ secrets.WORKFLOW_APP_ID }}
          private-key: ${{ secrets.WORKFLOW_APP_PRIVATE_KEY }}
          matrix-node-version: ${{ vars.MATRIX_NODE_VERSION || '["22", "24", "26"]' }}
          install-script: npm ci
          build-script: npm run build:release
          version-script: npm run changeset:version
          publish-script: npm run changeset:publish
          # cache-reset: true
          npm-token: ${{ secrets.NPM_TOKEN }}
